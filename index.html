<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR 메이커</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#16171d;
    --paper:#f4f1ea;
    --panel:#ffffff;
    --accent:#2f4fd8;
    --accent-dark:#2238a8;
    --marker:#ffd84a;
    --muted:#6a6b74;
    --mono:'IBM Plex Mono', Menlo, Consolas, monospace;
    --sans:'IBM Plex Sans KR', -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink); font-family:var(--sans);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:56px 20px 40px;
    background-color:var(--paper);
    background-image:radial-gradient(#c9c4b6 1.2px, transparent 1.2px);
    background-size:20px 20px;
  }

  .card{
    width:100%; max-width:860px;
    background:var(--panel);
    border:2px solid var(--ink);
    border-radius:4px;
    box-shadow:10px 10px 0 var(--accent);
    display:grid; grid-template-columns:1fr 320px;
  }

  /* 왼쪽: 입력 */
  .left{ padding:36px 36px 32px; border-right:2px dashed var(--ink); }
  .tag{
    display:inline-block; font-family:var(--mono); font-size:11px; font-weight:600;
    letter-spacing:0.16em; text-transform:uppercase;
    background:var(--ink); color:var(--paper); padding:4px 10px; margin-bottom:18px;
  }
  h1{ font-size:44px; line-height:1.05; margin:0 0 14px; font-weight:700; letter-spacing:-0.03em; }
  h1 mark{ background:linear-gradient(transparent 58%, var(--marker) 58%); color:inherit; padding:0 2px; }
  .lead{ margin:0 0 30px; color:var(--muted); font-size:15px; line-height:1.65; }

  label{ display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:8px; }
  label span{ font-family:var(--mono); font-weight:400; color:var(--muted); }
  textarea{
    width:100%; height:96px; resize:vertical;
    font-family:var(--mono); font-size:14px; line-height:1.5; color:var(--ink);
    border:2px solid var(--ink); border-radius:4px; background:#fbfaf7; padding:12px 14px; outline:none;
  }
  textarea:focus{ border-color:var(--accent); background:#fff; box-shadow:0 0 0 4px rgba(47,79,216,.15); }

  .make{
    margin-top:16px; width:100%;
    font-family:var(--sans); font-size:16px; font-weight:700;
    background:var(--accent); color:#fff;
    border:2px solid var(--ink); border-radius:4px; padding:14px; cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .08s, box-shadow .08s, background .12s;
  }
  .make:hover{ background:var(--accent-dark); }
  .make:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .make:focus-visible, .ghost:focus-visible, .save:focus-visible{ outline:3px solid var(--marker); outline-offset:2px; }
  .hint{ margin-top:12px; font-size:12px; color:var(--muted); text-align:center; }
  kbd{ font-family:var(--mono); font-size:11px; border:1.5px solid var(--ink); border-bottom-width:3px; border-radius:4px; padding:1px 6px; color:var(--ink); }

  /* 오른쪽: QR 라벨 */
  .right{
    padding:36px 28px; background:#f9f8f4;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  }
  .label{
    width:100%; max-width:256px; background:#fff;
    border:2px solid var(--ink); border-radius:4px; padding:16px 16px 12px;
    transform:rotate(-2deg); transition:transform .25s;
  }
  .done .label{ transform:rotate(0); }
  .label-top{
    display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px;
    letter-spacing:0.12em; color:var(--muted); margin-bottom:12px;
  }
  .slot{
    aspect-ratio:1; border:2px dashed #c9c4b6; border-radius:2px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:#a6a294; font-size:13px; line-height:1.5; padding:12px;
  }
  #qr{ display:none; }
  #qr img, #qr canvas{ width:100%; height:auto; display:block; }
  .done .slot{ display:none; }
  .done #qr{ display:block; }
  .caption{
    margin-top:12px; padding-top:10px; border-top:2px dotted #c9c4b6;
    font-family:var(--mono); font-size:11px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .actions{ display:none; width:100%; max-width:256px; gap:8px; }
  .done .actions{ display:flex; }
  .save, .ghost{
    flex:1; text-align:center; font-family:var(--sans); font-size:14px; font-weight:700;
    border:2px solid var(--ink); border-radius:4px; padding:10px; cursor:pointer; text-decoration:none;
  }
  .save{ background:var(--marker); color:var(--ink); box-shadow:3px 3px 0 var(--ink); }
  .save:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .ghost{ background:transparent; color:var(--ink); }
  .ghost:hover{ background:#fff; }

  footer{
    width:100%; max-width:860px; margin-top:28px;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;
    font-family:var(--mono); font-size:12px; color:var(--muted);
  }
  footer a{ color:var(--accent); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }

  @media (max-width:720px){
    .card{ grid-template-columns:1fr; box-shadow:6px 6px 0 var(--accent); }
    .left{ padding:26px 22px; border-right:none; border-bottom:2px dashed var(--ink); }
    h1{ font-size:34px; }
    .right{ padding:28px 22px; }
  }
</style>
</head>
<body>
  <main class="card" id="card">
    <section class="left">
      <span class="tag">QR Maker</span>
      <h1>링크를 <mark>QR 코드</mark>로</h1>
      <p class="lead">주소나 글을 넣고 만들기를 누르세요.<br>완성된 QR은 PNG 이미지로 저장할 수 있습니다.</p>

      <label for="text">내용 <span id="count">0자</span></label>
      <textarea id="text" placeholder="https://example.com" autocomplete="off"></textarea>
      <button type="button" class="make" id="make">QR 코드 만들기 →</button>
      <div class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 로도 만들 수 있어요</div>
    </section>

    <section class="right">
      <div class="label">
        <div class="label-top"><span>NO. 001</span><span>QR CODE</span></div>
        <div class="slot">여기에<br>QR 코드가<br>나타납니다</div>
        <div id="qr"></div>
        <div class="caption" id="caption">—</div>
      </div>
      <div class="actions">
        <a class="save" id="download" download="qrcode.png">PNG 저장</a>
        <button type="button" class="ghost" id="resetBtn">새로 만들기</button>
      </div>
    </section>
  </main>

  <footer>
    <span>브라우저 안에서만 처리 · 서버 전송 없음</span>
    <span>Made by <a href="mailto:uzzin501@gmail.com">uzzin501@gmail.com</a></span>
  </footer>

<script>
  const card = document.getElementById('card');
  const input = document.getElementById('text');
  const qrEl = document.getElementById('qr');
  const dl = document.getElementById('download');
  const caption = document.getElementById('caption');
  const count = document.getElementById('count');

  function make(){
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    qrEl.innerHTML = '';
    new QRCode(qrEl, { text, width: 512, height: 512 });
    dl.href = qrEl.querySelector('canvas').toDataURL('image/png');
    caption.textContent = text;
    card.classList.add('done');
  }

  document.getElementById('make').onclick = make;
  // 여러 줄 입력을 위해 Enter는 줄바꿈, Ctrl/⌘+Enter로 생성
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); make(); } });
  input.addEventListener('input', () => { count.textContent = input.value.length + '자'; });
  document.getElementById('resetBtn').onclick = () => {
    card.classList.remove('done');
    input.value = '';
    count.textContent = '0자';
    caption.textContent = '—';
    input.focus();
  };
</script>
</body>
</html>
